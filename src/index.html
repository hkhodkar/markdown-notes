<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Markdown Notes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A fast, offline-first markdown notes app with live preview, tags, search and import/export.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // apply the saved theme before first paint to avoid a flash
    try {
      var prefs = JSON.parse(localStorage.getItem('markdown-notes:prefs') || '{}');
      var dark = prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset['theme'] = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
